name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Monthly scan catches new query/advisory coverage even without a code change.
    - cron: '30 4 1 * *'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'liberica'
        java-version: '17'
        cache: 'gradle'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java-kotlin
        # We build via Gradle below, so "manual" - not "none" (that skips compiling, weaker analysis).
        # The "overlay database" log notice each run is harmless, just a "none"-only optimization we skip.
        build-mode: manual
    - name: Build
      run: ./gradlew jar -x test
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:java-kotlin"
