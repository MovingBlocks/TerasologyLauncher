on:
  push:
    branches: [master]
  workflow_dispatch: {}

name: Nightly

# Serializes across all triggers (push or manual dispatch, from any ref) since
# every run competes to replace the same `nightly` release/tag - without this,
# an older run finishing after a newer one can repoint `nightly` at a stale
# commit.
concurrency:
  group: nightly-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build nightly asset for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux64, linuxarm64, mac64, macarm64, windows64, windowsarm64]
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # nebula.release's dev-version scheme (used below, since we don't pass
          # -Prelease.useLastTag=true) counts commits since the last tag - it needs
          # full history to do that, not just the tip commit.
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '17'
          cache: 'gradle'
      - name: Bundle distribution for ${{ matrix.platform }}
        run: ./gradlew ${{ matrix.platform }}DistZip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: build/distributions/TerasologyLauncher-${{ matrix.platform }}-*.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish nightly release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform assets
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Remove previous nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `gh release delete` fails if there's no prior `nightly` release (e.g. first
        # run ever) - that case is fine to skip. Any other failure means the old
        # release/tag may still be around, which would make the next step attach the
        # new release to the stale tag's commit (--target is ignored for existing
        # tags), so that must stop the job rather than being swallowed.
        run: |
          if ! gh release delete nightly --yes --cleanup-tag --repo ${{ github.repository }}; then
            if gh release view nightly --repo ${{ github.repository }} >/dev/null 2>&1; then
              echo "::error::Failed to delete the existing nightly release/tag; refusing to publish onto it."
              exit 1
            fi
            echo "No existing nightly release to delete."
          fi
      - name: Publish nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create nightly dist/*.zip
          --repo ${{ github.repository }}
          --target ${{ github.sha }}
          --title "Nightly build (${{ github.sha }})"
          --notes "Automated build from master@${{ github.sha }}. Not a stable release - replaced on every push to master. The launcher's own version display and each asset's filename both embed this same commit hash, so a bug report always maps back to an exact commit."
          --prerelease
