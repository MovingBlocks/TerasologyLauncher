// Uses Bellsoft Liberica JRE - the "full" edition specifically, since it's the only free,
// redistributable build that bundles JavaFX in (JavaFX was split out of the JDK since Java 11).
// https://bell-sw.com/pages/downloads/
def jdkVersion = "25+37"
def jreUrlFilenames = [
        Linux64   : "linux-amd64-full.tar.gz",
        Windows64 : "windows-amd64-full.zip",
        Mac       : "macos-amd64-full.zip"
]

tasks.register("createRelease") {
    group "Distribution"
    description "Bundles the project with a JRE for each platform"
    dependsOn distZip

    doLast {
        println "Created release: " + version
    }
}

tasks.register("downloadJreAll") {
    group "JRE"
    description "Downloads Launcher JREs for all platforms"
}

tasks.register("unpackJreAll") {
    group "JRE"
    description "Unpack JREs for all platforms"
}


def createJreTasks(String taskNameBase,
                   String downloadUrl,
                   String downloadFile,
                   String unpackDir) {

    tasks.register("download$taskNameBase", Download) {
        group "JRE"
        src downloadUrl
        dest downloadFile
        overwrite false
    }

    def unpackTask = task "unpack$taskNameBase"(type: Copy) {
        group "JRE"
        from(downloadFile.endsWith("zip")
                ? zipTree(downloadFile)
                : tarTree(downloadFile)) {
            eachFile { fcd ->
                fcd.relativePath = new RelativePath(
                        true, fcd.relativePath.segments.drop(1))
                // filePermissions{} below overrides every copied entry's mode with a
                // fresh default, discarding the executable bit the zip/tar recorded for
                // bin/* (java, javaw, ...) - restore it explicitly or the bundled JRE
                // can't be executed after unpacking.
                if (fcd.relativePath.segments.length > 0 && fcd.relativePath.segments[0] == "bin") {
                    fcd.permissions { unix(0755) }
                }
            }
            includeEmptyDirs = false
        }
        into unpackDir
        filePermissions {
            user.write = true
        }
        dependsOn "download${taskNameBase}"
    }

    return unpackTask
}

jreUrlFilenames.each { os, file ->
    def launcherTaskBase = "Jre${os}"
    def unpackTask = createJreTasks(
            launcherTaskBase,
            "https://download.bell-sw.com/java/$jdkVersion/bellsoft-jre$jdkVersion-$file",
            "$projectDir/jre/$os-$jdkVersion-$file",
            "$projectDir/jre/$os")

    distributions {
        def distName = os.toLowerCase()
        def distBase = distName.replaceAll("\\d", "") // drop '32' or '64'

        "$distName" {
            contents {
                with distributions.main.contents

                into("jre") {
                    from unpackTask
                    // The dist Zip/Tar tasks don't carry over the executable bit
                    // unpackTask's own eachFile restored on disk - re-apply it here so
                    // jre/bin/java is actually executable inside the packaged archive.
                    eachFile { fcd ->
                        def segs = fcd.relativePath.segments
                        // relativePath here is rooted at the whole distribution, not the
                        // "jre" subtree, so match on the file's immediate parent dir
                        // rather than assuming "bin" is segments[0].
                        if (segs.length >= 2 && segs[segs.length - 2] == "bin") {
                            fcd.permissions { unix(0755) }
                        }
                    }
                }

                from("${projectDir}/buildres/${distBase}")
                from("${projectDir}/buildres/${distName}")

                if (os == "Windows64") {
                    // Dynamically generated by launch4j (see the launch4j {} block in
                    // build.gradle) instead of the checked-in static binary this replaces.
                    from(tasks.named("createExe"))
                }
            }
        }
    }

    downloadJreAll.dependsOn "download${launcherTaskBase}"
    unpackJreAll.dependsOn "unpack${launcherTaskBase}"

    createRelease.dependsOn "assemble${os}Dist"
}

distributions {
    mac {
        contents {
            into "TerasologyLauncher.app/Contents"
            exclude "**/*.bat"
            eachFile { details ->
                details.path = details.path.toString().replaceAll("(Contents)/bin/(.+)", "\$1/MacOS/\$2")
            }
        }
    }
}

tasks.withType(CreateStartScripts).configureEach {
    def unixTemplate = file("$projectDir/buildres/scripts/unixStartScript.txt")
    def windowsTemplate = file("$projectDir/buildres/scripts/windowsStartScript.txt")

    assert project.file(unixTemplate).exists()
    assert project.file(windowsTemplate).exists()

    unixStartScriptGenerator.template = resources.text.fromFile(unixTemplate)
    windowsStartScriptGenerator.template = resources.text.fromFile(windowsTemplate)
}
